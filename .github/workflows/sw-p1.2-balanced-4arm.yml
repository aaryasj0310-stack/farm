name: SW P1.2 Balanced Four-Arm Experiment

on:
  push:
    branches:
      - diagnostic/sw-p1-post-purchase-regression
    paths:
      - .github/workflows/sw-p1.2-balanced-4arm.yml
      - simulations/experiments/run_sw_p1_serviceability_activation_4arm.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sw-p1.2-four-arm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy "kaggle-environments==1.32.7"
      - name: Verify exact runtime parity and syntax
        run: |
          cmp agent/config.py submission/config.py
          cmp agent/execution/task_scheduler.py submission/execution/task_scheduler.py
          cmp agent/strategy/land_serviceability_model.py submission/strategy/land_serviceability_model.py
          cmp agent/strategy/macro_planner.py submission/strategy/macro_planner.py
          python -m py_compile             agent/config.py             agent/execution/task_scheduler.py             agent/strategy/land_serviceability_model.py             agent/strategy/macro_planner.py             agent/tests/test_sw_serviceability_activation.py             simulations/experiments/run_sw_p1_serviceability_activation_4arm.py
      - name: Focused P1 through P1.2 tests
        run: |
          set -o pipefail
          pytest             agent/tests/test_sw_serviceability_activation.py             agent/tests/test_sw_workload_responsive_scheduler.py             agent/tests/test_land_serviceability_model.py             agent/tests/test_sw_p1_committed_herd.py             agent/tests/test_macro_planner.py             -q | tee sw-p1.2-focused.log
      - name: Full regression suite
        run: |
          set -o pipefail
          pytest agent/tests/ -q | tee sw-p1.2-full.log
      - name: Canonical build and 720-turn package validation
        run: |
          set -o pipefail
          python scripts/build_submission.py | tee sw-p1.2-build.log
      - name: Run balanced four-arm experiment
        run: |
          set -o pipefail
          python simulations/experiments/run_sw_p1_serviceability_activation_4arm.py | tee sw-p1.2-4arm.log
      - name: Commit structured P1.2 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostic/sw-p1-post-purchase-regression
          git add             simulations/experiments/results/sw_p1_serviceability_activation_4arm_balanced.json             simulations/experiments/results/sw_p1_serviceability_activation_results.md
          if ! git diff --cached --quiet; then
            git commit -m "test(sw-p1.2): record balanced four-arm activation results"
            git push origin HEAD:diagnostic/sw-p1-post-purchase-regression
          fi
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-p1.2-balanced-four-arm
          path: |
            sw-p1.2-focused.log
            sw-p1.2-full.log
            sw-p1.2-build.log
            sw-p1.2-4arm.log
            simulations/experiments/results/sw_p1_serviceability_activation_4arm_balanced.json
            simulations/experiments/results/sw_p1_serviceability_activation_results.md
          if-no-files-found: ignore
