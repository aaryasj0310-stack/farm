name: SW P1.2 Serviceability Activation Validation

on:
  push:
    branches:
      - diagnostic/sw-p1-post-purchase-regression
    paths:
      - .github/workflows/sw-p1.2-serviceability-activation-validation.yml
      - agent/config.py
      - agent/strategy/land_serviceability_model.py
      - agent/strategy/macro_planner.py
      - agent/execution/task_scheduler.py
      - submission/config.py
      - submission/strategy/land_serviceability_model.py
      - submission/strategy/macro_planner.py
      - submission/execution/task_scheduler.py
      - agent/tests/test_sw_serviceability_activation.py
      - agent/tests/test_sw_workload_responsive_scheduler.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy "kaggle-environments==1.32.7"
      - name: Verify runtime parity and syntax
        run: |
          cmp agent/config.py submission/config.py
          cmp agent/execution/task_scheduler.py submission/execution/task_scheduler.py
          cmp agent/strategy/land_serviceability_model.py submission/strategy/land_serviceability_model.py
          cmp agent/strategy/macro_planner.py submission/strategy/macro_planner.py
          python -m py_compile             agent/config.py             agent/execution/task_scheduler.py             agent/strategy/land_serviceability_model.py             agent/strategy/macro_planner.py             agent/tests/test_sw_serviceability_activation.py
      - name: Focused P1-P1.2 regression tests
        run: |
          set -o pipefail
          pytest             agent/tests/test_sw_serviceability_activation.py             agent/tests/test_sw_workload_responsive_scheduler.py             agent/tests/test_land_serviceability_model.py             agent/tests/test_sw_p1_committed_herd.py             agent/tests/test_macro_planner.py             -q | tee sw-p1.2-focused.log
      - name: Full agent regression suite
        run: |
          set -o pipefail
          pytest agent/tests/ -q | tee sw-p1.2-full.log
      - name: Canonical build and isolated 720-turn validation
        run: |
          set -o pipefail
          python scripts/build_submission.py | tee sw-p1.2-build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-p1.2-validation
          path: |
            sw-p1.2-focused.log
            sw-p1.2-full.log
            sw-p1.2-build.log
          if-no-files-found: ignore
