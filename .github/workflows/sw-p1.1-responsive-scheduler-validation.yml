name: SW P1.1 Responsive Scheduler Validation

on:
  # Historical P1.1 validation is frozen; P1.2 has its own validation workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy "kaggle-environments==1.32.7"
      - name: Verify source package parity and syntax
        run: |
          cmp agent/config.py submission/config.py
          cmp agent/execution/task_scheduler.py submission/execution/task_scheduler.py
          python -m py_compile agent/config.py agent/execution/task_scheduler.py agent/tests/test_sw_workload_responsive_scheduler.py
      - name: Focused scheduler tests
        run: |
          set -o pipefail
          pytest             agent/tests/test_sw_workload_responsive_scheduler.py             agent/tests/test_dynamic_zonal_allocation.py             agent/tests/test_adaptive_zonal_dispatch.py             agent/tests/test_sw_p1_committed_herd.py             -q | tee sw-p1.1-focused.log
      - name: Full agent regression suite
        run: |
          set -o pipefail
          pytest agent/tests/ -q | tee sw-p1.1-full.log
      - name: Canonical build and isolated 720-turn validation
        run: |
          set -o pipefail
          python scripts/build_submission.py | tee sw-p1.1-build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-p1.1-validation
          path: |
            sw-p1.1-focused.log
            sw-p1.1-full.log
            sw-p1.1-build.log
          if-no-files-found: ignore
