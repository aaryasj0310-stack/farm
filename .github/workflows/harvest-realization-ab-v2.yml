name: Harvest Realization A-B

on:
  push:
    branches:
      - fix/harvest-delivery-sale-completion-v2
    paths:
      - .github/workflows/harvest-realization-ab-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install A-B dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "kaggle-environments==1.32.7"

      - name: Run 20-pair harvest realization A-B
        run: |
          set -o pipefail
          python simulations/experiments/run_harvest_realization_ab.py | tee harvest-ab.log

      - name: Commit result artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/experiments/results/harvest_realization_ab_20pair_results.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "test(simulations): record 20-pair harvest realization A/B results"
            git push
          fi

      - name: Upload A-B artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-realization-ab-results
          path: |
            harvest-ab.log
            simulations/experiments/results/harvest_realization_ab_20pair_results.json
          if-no-files-found: ignore
