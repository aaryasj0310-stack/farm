name: SW P1 Paired Purchase Experiment

on:
  push:
    branches:
      - experiment/sw-p1-committed-herd-workload
    paths:
      - .github/workflows/sw-p1-ab.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install A-B dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "kaggle-environments==1.32.7"
      - name: Run 20 paired episodes on exact archived SHAs
        run: |
          set -o pipefail
          python simulations/experiments/run_sw_p1_committed_herd_ab.py | tee sw-p1-ab.log
      - name: Commit experimental result (no production merge)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/experiments/results/sw_p1_committed_herd_20pair.json
          if ! git diff --cached --quiet; then
            git commit -m "test(sw-p1): record paired purchase-workload results"
            git push
          fi
      - name: Upload result and job log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-p1-paired-results
          path: |
            sw-p1-ab.log
            simulations/experiments/results/sw_p1_committed_herd_20pair.json
          if-no-files-found: ignore
