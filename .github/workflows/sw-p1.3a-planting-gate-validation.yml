name: SW P1.3-A Generic Planting Gate Validation

on:
  push:
    branches:
      - experiment/sw-p13-planting-gate
    paths:
      - .github/workflows/sw-p1.3a-planting-gate-validation.yml
      - agent/config.py
      - agent/strategy/macro_planner.py
      - submission/config.py
      - submission/strategy/macro_planner.py
      - agent/tests/test_sw_generic_planting_gate.py
      - agent/tests/test_production_no_sw.py
      - simulations/experiments/run_sw_p13_planting_gate_ab.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy "kaggle-environments==1.32.7"
      - name: Verify source/submission parity and syntax
        run: |
          cmp agent/config.py submission/config.py
          cmp agent/strategy/macro_planner.py submission/strategy/macro_planner.py
          python -m py_compile agent/config.py agent/strategy/macro_planner.py agent/tests/test_sw_generic_planting_gate.py simulations/experiments/run_sw_p13_planting_gate_ab.py
      - name: No-game three-arm runner snapshot and flag smoke check
        run: |
          python - <<'PY'
          import importlib.util
          import os
          import tempfile
          from simulations.experiments import run_sw_p13_planting_gate_ab as exp

          def load_config(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              cfg = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(cfg)
              return cfg

          with tempfile.TemporaryDirectory(prefix="sw-p13-smoke-") as tmp:
              treatment, hashes, fingerprint = exp._snapshot_worktree_agent(tmp)
              assert hashes and len(fingerprint) == 64
              control = exp._extract_agent(exp.BASELINE_SHA, "control_smoke")
              p12 = exp._extract_agent(exp.P12_SHA, "p12_smoke")
              for label, directory in (("Control", control), ("P1.2", p12), ("P1.3-A", treatment)):
                  assert os.path.isfile(os.path.join(directory, "main.py"))
                  cfg = load_config(os.path.join(directory, "config.py"), label.replace(".", "_") + "_smoke_config")
                  exp._configure_arm(cfg, label)
                  if label == "P1.3-A":
                      assert cfg.SW_GENERIC_PLANTING_GATE_ENABLED is True
                  elif hasattr(cfg, "SW_GENERIC_PLANTING_GATE_ENABLED"):
                      assert cfg.SW_GENERIC_PLANTING_GATE_ENABLED is False
                  print(label, "configuration and runtime snapshot verified")
          PY
      - name: Focused P1.3-A regression tests
        run: |
          set -o pipefail
          pytest agent/tests/test_sw_generic_planting_gate.py agent/tests/test_sw_serviceability_activation.py agent/tests/test_sw_workload_responsive_scheduler.py agent/tests/test_production_no_sw.py agent/tests/test_macro_planner.py -q | tee sw-p13a-focused.log
      - name: Full agent regression suite
        run: |
          set -o pipefail
          pytest agent/tests/ -q | tee sw-p13a-full.log
      - name: Canonical submission build and isolated 720-turn check
        run: |
          set -o pipefail
          python scripts/build_submission.py | tee sw-p13a-build.log
      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-p13a-validation
          path: |
            sw-p13a-focused.log
            sw-p13a-full.log
            sw-p13a-build.log
          if-no-files-found: ignore
