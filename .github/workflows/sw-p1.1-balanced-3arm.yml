name: SW P1.1 Balanced Three-Arm Experiment

on:
  push:
    branches:
      - diagnostic/sw-p1-post-purchase-regression
    paths:
      - .github/workflows/sw-p1.1-balanced-3arm.yml
      - simulations/experiments/run_sw_p1_responsive_scheduler_3arm.py
      - agent/config.py
      - agent/execution/task_scheduler.py
      - submission/config.py
      - submission/execution/task_scheduler.py
      - agent/tests/test_sw_workload_responsive_scheduler.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "kaggle-environments==1.32.7"
      - name: Run balanced three-arm experiment
        run: |
          set -o pipefail
          python simulations/experiments/run_sw_p1_responsive_scheduler_3arm.py | tee sw-p1.1-3arm.log
      - name: Commit structured results to diagnostic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             simulations/experiments/results/sw_p1_responsive_scheduler_3arm_balanced.json             simulations/experiments/results/sw_p1_responsive_scheduler_results.md
          if ! git diff --cached --quiet; then
            git commit -m "test(sw-p1.1): record balanced three-arm scheduler results"
            git push
          fi
      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-p1.1-balanced-three-arm
          path: |
            sw-p1.1-3arm.log
            simulations/experiments/results/sw_p1_responsive_scheduler_3arm_balanced.json
            simulations/experiments/results/sw_p1_responsive_scheduler_results.md
          if-no-files-found: ignore
